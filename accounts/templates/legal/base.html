<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Yalla Market{% endblock %}</title>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: light dark; }
      body { margin: 0; background: Canvas; color: CanvasText; line-height: 1.65; }
      main { width: min(760px, calc(100% - 32px)); margin: 32px auto 64px; }
      nav { display: flex; flex-wrap: wrap; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      a { color: #2e7d32; text-underline-offset: 3px; }
      h1 { line-height: 1.2; margin: 32px 0 8px; }
      h2 { line-height: 1.3; margin-top: 32px; }
      .muted { opacity: .72; }
      .callout { padding: 16px; border-radius: 12px; background: color-mix(in srgb, #2e7d32 12%, Canvas); }
      .button { display: inline-block; padding: 10px 16px; border-radius: 8px; color: white; background: #2e7d32; text-decoration: none; font-weight: 700; }
      footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Legal pages">
        <strong>Yalla Market</strong>
        <a href="{% url 'privacy-policy' %}">Privacy</a>
        <a href="{% url 'terms-of-use' %}">Terms</a>
        <a href="{% url 'account-deletion' %}">Delete account</a>
      </nav>
      {% block content %}{% endblock %}
      <footer class="muted">© 2026 Yalla Market. Last updated: 27 July 2026.</footer>
    </main>
  </body>
</html>
