name: yalla-performance

x-app: &app
  build:
    context: ../..
  image: yalla-performance:local
  user: "0:0"
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.performance_settings
    APP_ENV: performance
    PERF_LOCAL_STAGING: "1"
    DEBUG: "False"
    SECRET_KEY: ${PERF_SECRET_KEY:?Run bootstrap.py first}
    DATABASE_URL: postgresql://perf@postgres:5432/yalla_perf
    DATABASE_PASSWORD: ${PERF_DATABASE_PASSWORD:?Run bootstrap.py first}
    REDIS_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
    REDIS_RATE_LIMIT_URL: redis://redis:6379/2
    REDIS_CELERY_BROKER_URL: redis://redis:6379/3
    RATE_LIMIT_MODE: enforce
    RATE_LIMIT_KEY_SECRET: ${PERF_RATE_LIMIT_SECRET:?Run bootstrap.py first}
    RATE_LIMIT_CLIENT_IP_HEADER: ""
    RATE_LIMIT_ENFORCE_SCOPES: login_ip,login_identifier,admin_login_ip,admin_login_identifier,signup_ip,signup_email,otp_send_ip,otp_send_identifier,otp_verify_ip,otp_verify_identifier,refresh_ip,refresh_token
    API_CACHE_ENABLED: "False"
    PUBLIC_MEDIA_ROOT: /perf-media/public
    PRIVATE_MEDIA_ROOT: /perf-media/private
    WEB_CONCURRENCY: "4"
    GUNICORN_THREADS: "2"
  volumes:
    - perf-media:/perf-media
    - ./artifacts:/artifacts
  networks: [perf]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yalla_perf
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: ${PERF_DATABASE_PASSWORD:?Run bootstrap.py first}
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, log_min_duration_statement=500]
    volumes: [perf-db:/var/lib/postgresql/data]
    networks: [perf]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U perf -d yalla_perf]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: [redis-server, --maxmemory, 256mb, --maxmemory-policy, volatile-lru]
    networks: [perf]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    networks: [perf, ingress]
    ports: ["127.0.0.1:18025:8025"]
  app:
    <<: *app
    command: [gunicorn, --config, config/gunicorn.conf.py, config.wsgi:application]
  worker:
    <<: *app
    command: [celery, -A, config, worker, -l, WARNING, -c, "4", -Q, "notifications,mail,default", -n, "perf@%h"]
  media-worker:
    <<: *app
    command: [celery, -A, config, worker, -l, WARNING, -c, "1", -Q, media, -n, "perf-media@%h"]
  beat:
    <<: *app
    command: [celery, -A, config, beat, -l, WARNING, --schedule, /tmp/perf-beat]
  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - perf-media:/perf-media:ro
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:18081:8081"]
    networks: [perf, ingress]
    depends_on: [app]

networks:
  perf: {internal: true}
  ingress:
volumes:
  perf-db:
  perf-media:
