events {}
http {
    log_format perf escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_request_id","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"request_s":$request_time,"upstream_s":"$upstream_response_time","port":$server_port}';
    access_log /dev/stdout perf;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=api_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    upstream backend { server app:8000; keepalive 32; }
    # Production-equivalent general ingress policy, on loopback only.
    server {
        listen 8080;
        location /media/ { alias /perf-media/public/; }
        location / {
            limit_req zone=api_per_ip burst=60 nodelay;
            limit_conn api_connections 30;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
    # Isolated local capacity listener. Never used in a production deployment.
    server {
        listen 8081;
        location /media/ { alias /perf-media/public/; }
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
